# GSTPilot — Nginx reverse proxy
#
# Install to /etc/nginx/sites-available/gstpilot and symlink into
# sites-enabled. Replace REPLACE_DOMAIN with your domain before enabling.
#
# Certbot rewrites this file when you run --nginx: it injects the listen 443
# block, the certificate paths and the port-80 redirect. Everything below is
# written so that rewrite lands cleanly.

# Rate limit the auth endpoints. Credential stuffing against /api/auth is the
# one route on this app worth throttling by default.
limit_req_zone $binary_remote_addr zone=gstpilot_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_DOMAIN www.REPLACE_DOMAIN;

    # --- Upload ceiling -----------------------------------------------------
    # next.config.ts sets serverActions.bodySizeLimit to 25mb because a
    # multi-marketplace batch of xlsx exports is genuinely that large. Nginx
    # defaults to 1m and would reject those uploads with a 413 before Next ever
    # sees them. Keep these two numbers in step.
    client_max_body_size 30M;
    client_body_timeout 120s;

    # --- Timeouts -----------------------------------------------------------
    # Parsing and validating a month of invoices is not instant. The default
    # 60s proxy_read_timeout will cut long conversions off mid-flight.
    proxy_connect_timeout 30s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    # --- Security headers ---------------------------------------------------
    # HSTS is deliberately NOT set here; certbot adds it once TLS is live, and
    # sending it over plain http is meaningless.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml+rss
        image/svg+xml;

    # --- Immutable build assets --------------------------------------------
    # Everything under /_next/static is content-hashed, so it can be cached
    # forever. This is the single biggest repeat-visit win.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Same deal for anything you drop in public/.
    location /platforms/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # --- Auth throttle ------------------------------------------------------
    location /api/auth/ {
        limit_req zone=gstpilot_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Razorpay webhook ---------------------------------------------------
    # Must NOT be rate limited or buffered oddly: Razorpay retries on failure
    # and the signature is an HMAC over the raw body, so nothing may alter it.
    location /api/webhooks/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_request_buffering off;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Everything else ----------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Required for Next's dev/HMR websockets and for streamed RSC payloads.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # better-auth builds absolute callback URLs from this. Without it the
        # app believes it is on http and sign-in cookies break under HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Streaming: Next flushes RSC chunks progressively. Buffering them
        # defeats that and makes the first paint wait for the whole response.
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
}
